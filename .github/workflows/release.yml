on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to build
        required: true
        type: string

name: Create and Upload Release Artifact

jobs:
  generate:
    name: Create release-artifacts
    # Never raise the release glibc baseline by building on a newer runner.
    runs-on: ubuntu-22.04
    steps:
      - name: Get the release version
        id: get_version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.get_version.outputs.VERSION }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: Install Linux build deps
        run: sudo apt update && sudo apt install -y libdbus-1-dev libgtk-4-dev binutils python3
      - name: Build and Package Release
        env:
          RELEASE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "meeters") | .version')
          test "v$package_version" = "$RELEASE_TAG"
          echo "Building $RELEASE_TAG from $(git rev-parse HEAD)"
          cargo build --locked --release
          /usr/bin/python3 tests/check_glibc.py target/release/meeters --max-version 2.35
          cp assets/* target/release/
          tar -zcf "meeters-$RELEASE_TAG-linux-x86.tar.gz" -C target/release meeters meeters-appindicator.png meeters-appindicator-error.png meeters-appindicator-nomeetingsleft.png meeters-appindicator-somemeetingsleft.png
      - name: Upload the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: gh release upload "$RELEASE_TAG" "meeters-$RELEASE_TAG-linux-x86.tar.gz"
